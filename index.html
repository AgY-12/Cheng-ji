<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天机不可泄露</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 50%, #000000 100%);
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        }

        .scene {
            perspective: 1000px;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotator {
            position: relative;
            transform-style: preserve-3d;
            animation: rotate3d 8s linear infinite;
        }

        @keyframes rotate3d {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
            }
            25% {
                transform: rotateX(15deg) rotateY(90deg) rotateZ(5deg);
            }
            50% {
                transform: rotateX(0deg) rotateY(180deg) rotateZ(0deg);
            }
            75% {
                transform: rotateX(-15deg) rotateY(270deg) rotateZ(-5deg);
            }
            100% {
                transform: rotateX(0deg) rotateY(360deg) rotateZ(0deg);
            }
        }

        .text-container {
            font-size: clamp(2rem, 7vw, 5rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(255, 255, 255, 0.4),
                0 0 60px rgba(200, 200, 255, 0.3);
            letter-spacing: 0.1em;
            text-align: center;
            max-width: 90vw;
            transform-style: preserve-3d;
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(70deg);
            animation: ringPulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes ringPulse {
            0%, 100% {
                transform: translate(-50%, -50%) rotateX(70deg) scale(0.9);
                opacity: 0.3;
            }
            50% {
                transform: translate(-50%, -50%) rotateX(70deg) scale(1.1);
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="rotator">
            <div class="glow-ring"></div>
            <div class="text-container">骗你的，<br>天机不可泄露！</div>
        </div>
    </div>
</body>
</html>
